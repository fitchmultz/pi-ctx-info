name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_AUTOMATION_REF: 9b08d65d70a01c74c4e01477ccf9473e86be33ee # main

jobs:
  resolve:
    uses: fitchmultz/.github/.github/workflows/resolve-hosts.yml@9b08d65d70a01c74c4e01477ccf9473e86be33ee # main
    with:
      automation-ref: 9b08d65d70a01c74c4e01477ccf9473e86be33ee # main

  qualify:
    needs: resolve
    name: ubuntu-latest / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24.15.0', '24']
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi
          ref: ${{ needs.resolve.outputs.fork-ref }}
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - name: Build fork main
        working-directory: fork
        env:
          FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
          PI_OFFLINE: '1'
          PI_TELEMETRY: '0'
        run: |
          npm install --global "$(node -p 'require("../automation/package.json").packageManager')"
          echo "Fork ref: $FORK_REF"
          npm ci --ignore-scripts
          npm run hydrate:model-data
          git diff --exit-code
          npm run build:offline
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$FORK_REF"
          git diff --exit-code
      - name: Use the extension npm version
        run: npm install --global "$(node -p 'require("./extension/package.json").packageManager')"
      - name: Qualify declared official Pi
        env:
          PI_COMPAT_LANE_LABEL: official-declared
        run: |
          OFFICIAL_VERSION="$(node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const version = JSON.parse(readFileSync("extension/package.json", "utf8")).devDependencies?.["@earendil-works/pi-coding-agent"];
          const parts = typeof version === "string" && /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(version);
          assert.ok(parts && parts[0] === version && parts.slice(1).every(part => Number.isSafeInteger(Number(part))), "Declared official Pi must be an exact stable version");
          console.log(version);
          NODE
          )"
          node automation/scripts/qualify.mjs --repo pi-ctx-info --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$OFFICIAL_VERSION" --output "$RUNNER_TEMP/official-declared-evidence"
      - name: Qualify latest official Pi
        env:
          PI_COMPAT_LANE_LABEL: official-latest
          OFFICIAL_VERSION: ${{ needs.resolve.outputs.official-version }}
        run: |
          node automation/scripts/qualify.mjs --repo pi-ctx-info --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$OFFICIAL_VERSION" --output "$RUNNER_TEMP/official-latest-evidence"
      - name: Qualify fork Pi
        env:
          PI_COMPAT_FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
        run: |
          node automation/scripts/qualify.mjs --repo pi-ctx-info --source "$GITHUB_WORKSPACE/extension" \
            --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/fork-evidence"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-qualification-ubuntu-latest-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/official-declared-evidence
            ${{ runner.temp }}/official-latest-evidence
            ${{ runner.temp }}/fork-evidence
          if-no-files-found: error
          retention-days: 3

  compatibility:
    name: compatibility / compatibility
    if: always()
    needs: [resolve, qualify]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every lane
        env:
          RESOLVE: ${{ needs.resolve.result }}
          QUALIFY: ${{ needs.qualify.result }}
        run: test "$RESOLVE" = success && test "$QUALIFY" = success
