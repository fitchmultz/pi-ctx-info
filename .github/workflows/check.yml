name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Published official host
        run: |
          npm install --no-save --package-lock=false @earendil-works/pi-coding-agent@0.85.1 @earendil-works/pi-tui@0.85.1
          npm test
        env:
          PI_OFFLINE: "1"

  source-hosts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: earendil-works/pi
            ref: e4ce7b449f4d91589c8760d6fbfa6eaaf82b05fe
          - repository: fitchmultz/pi
            ref: 564bbcd1cc790b5f7f60525dc0f6cc119c10eef3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: host
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: extension
      - run: npm ci
        working-directory: host
      - run: npm run build
        working-directory: host
      - run: npm test
        working-directory: extension
        env:
          PI_HOST_INDEX: ${{ github.workspace }}/host/packages/coding-agent/dist/index.js
          PI_OFFLINE: "1"
